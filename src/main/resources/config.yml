# LagLens - конфигурация.
# Плагин только читает состояние сервера и ничего не меняет.

scan:
  # Сколько чанков обрабатывать за один тик сервера.
  # Обход чанков (getTileEntities) - дорогая операция, поэтому скан разбит на
  # порции по тикам, чтобы сам отчёт не вызвал лаг-спайк.
  # Меньше значение - безопаснее, но скан идёт дольше. Дефолт подобран с запасом
  # в безопасную сторону.
  chunks-per-tick: 200

# Пороги, при которых показатель считается проблемой и попадает в отчёт.
thresholds:
  # Чанк попадает в список подозрительных, если тайл-энтити в нём не меньше этого числа.
  chunk-tile-entities: 50
  # Отдельно предупреждаем про хопперы: если их в одном чанке не меньше - это частая
  # причина лагов (каждый тикает и проверяет соседние контейнеры).
  chunk-hoppers: 100
  # Мир помечается проблемным, если сущностей в нём не меньше этого числа.
  world-entities: 1000
  # Порог для брошенных предметов (dropped items) в мире - частый признак незакрытой ловушки.
  world-dropped-items: 500
  # TPS ниже этого значения - сервер уже подлагивает (норма - около 20).
  tps-warning: 18.0
  # MSPT (миллисекунд на тик) выше этого - тик не укладывается в бюджет 50 мс.
  mspt-warning: 45.0

report:
  # Сколько «горячих» чанков показывать в топе.
  top-chunks: 5
  # Сколько крупнейших скоплений сущностей показывать.
  top-entity-clusters: 3

# История отчётов. Каждый /lagreport сохраняет итог в файл history.db (SQLite)
# в папке плагина. Запись идёт в фоновом потоке и сервер не тормозит.
history:
  # false - отчёты строятся как раньше, но не сохраняются.
  enabled: true
  # Сколько последних отчётов хранить. Более старые удаляются при каждой записи.
  keep: 200
  # Сколько отчётов показывать по /lagreport history, если число не указано.
  shown: 5
